<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Validator</title>
</head>
<body>
    <div>
    <h2>Vote Validator</h2>
    <label for="">Name</label>
    <input type="text" id="name" placeholder="Enter Your Name">
    <label for="">age</label>
    <input type="number" id="age" placeholder="Enter your Age">
    <button onclick="vote()">Submit</button>

    <script>
        //dom -- Document Object Model
        function vote(){
            var name = document.getElementById("name").value;
            var age = document.getElementById("age").value;
            var result = document.getElementById("result");
            if(age>=18){
                //alert(name + " is eligible to vote");
                result.innerHTML = name + " is eligible to vote";
            }else{
                //alert(name + " is not eligible to vote");
                result.innerHTML = name + " you are still a child 🧒";
            }
        }
    </script>
    <p id="result"> Results will be displayed here</p>
    </div>
    <style>
        body{
            background-color: antiquewhite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h2{
            color: burlywood;
            background-color: brown;
        }
        div{
            display: flex;
            flex-direction:column;
            align-items: center;
            justify-content: center;
            border: 10px solid black;
            margin: 100px;
            height: 500px;
            width: 500px;
            border-radius: 20%;
            font-size: 35px;
        }
    </style>
</body>
</html>
